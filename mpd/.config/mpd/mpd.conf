# Location of your music files
music_directory      "~/music"

# Location of MPD internal playlists
playlist_directory   "~/.mpd/playlists"

# General options
port                 "6600"
restore_paused       "yes"
auto_update          "yes"

# Input plugin for streaming
input {
    plugin "curl"
}

# =============================================================================
# DIRECTORY CREATION COMMANDS
# Run the following commands in your terminal to create the necessary folders:
#
# mkdir -p ~/music
# mkdir -p ~/.mpd/playlists
# =============================================================================
